name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    # Placeholders so `next build` can import the auth route. The build never
    # connects to a database or signs anything; real values live in Vercel.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
